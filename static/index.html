<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Booking</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #e94560; }
        .container { max-width: 800px; margin: 0 auto; }
        #movies { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .movie-card { background: #16213e; padding: 20px; border-radius: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .movie-card:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(233, 69, 96, 0.3); }
        .movie-title { font-size: 1.3em; font-weight: bold; color: #e94560; }
        .movie-info { color: #a0a0a0; margin-top: 5px; }
        #seats-container { display: none; }
        .screen { background: #e94560; height: 30px; border-radius: 50%; margin: 20px auto; width: 200px; display: flex; align-items: center; justify-content: center; font-size: 0.8em; opacity: 0.7; }
        .seat-grid { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .seat-row { display: flex; gap: 8px; }
        .seat { width: 35px; height: 35px; background: #0f3460; border-radius: 8px 8px 12px 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8em; transition: background 0.2s; }
        .seat:hover:not(.booked) { background: #e94560; }
        .seat.selected { background: #e94560; }
        .seat.booked { background: #333; cursor: not-allowed; color: #666; }
        .seat-label { font-size: 0.7em; color: #a0a0a0; }
        .back-btn { background: transparent; border: 1px solid #e94560; color: #e94560; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .back-btn:hover { background: #e94560; color: #fff; }
        .legend { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-color { width: 20px; height: 20px; border-radius: 4px; }
        .available { background: #0f3460; }
        .booked-legend { background: #333; }
        .selected-legend { background: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cinema Booking</h1>
        <div id="movies"></div>
        <div id="seats-container">
            <button class="back-btn" onclick="showMovies()">← Back to Movies</button>
            <h2 id="movie-title" style="text-align: center; margin-bottom: 10px;"></h2>
            <div class="screen">SCREEN</div>
            <div class="seat-grid" id="seat-grid"></div>
            <div class="legend">
                <div class="legend-item"><div class="legend-color available"></div> Available</div>
                <div class="legend-item"><div class="legend-color booked-legend"></div> Booked</div>
                <div class="legend-item"><div class="legend-color selected-legend"></div> Selected</div>
            </div>
        </div>
    </div>
    <script>
        let currentMovie = null;
        let selectedSeats = [];

        async function loadMovies() {
            const res = await fetch('/movies');
            const movies = await res.json();
            const container = document.getElementById('movies');
            container.innerHTML = movies.map(m => `
                <div class="movie-card" onclick="selectMovie('${m.id}', '${m.title}', ${m.rows}, ${m.seats_per_row})">
                    <div class="movie-title">${m.title}</div>
                    <div class="movie-info">${m.rows} rows × ${m.seats_per_row} seats</div>
                </div>
            `).join('');
        }

        async function selectMovie(id, title, rows, seatsPerRow) {
            currentMovie = { id, title, rows, seatsPerRow };
            document.getElementById('movies').style.display = 'none';
            document.getElementById('seats-container').style.display = 'block';
            document.getElementById('movie-title').textContent = title;
            await loadSeats(id, rows, seatsPerRow);
        }

        async function loadSeats(movieId, rows, seatsPerRow) {
            const res = await fetch(`/movies/${movieId}/seats`);
            const bookedSeats = await res.json();
            const bookedIds = new Set(bookedSeats.map(s => s.seat_id));

            const grid = document.getElementById('seat-grid');
            grid.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'seat-row';
                const rowLabel = String.fromCharCode(65 + r);

                for (let s = 0; s < seatsPerRow; s++) {
                    const seatId = `${rowLabel}${s + 1}`;
                    const seat = document.createElement('div');
                    seat.className = 'seat' + (bookedIds.has(seatId) ? ' booked' : '');
                    seat.textContent = seatId;

                    if (!bookedIds.has(seatId)) {
                        seat.onclick = () => toggleSeat(seatId, seat);
                    }

                    rowEl.appendChild(seat);
                }
                grid.appendChild(rowEl);
            }
        }

        function toggleSeat(seatId, el) {
            if (selectedSeats.includes(seatId)) {
                selectedSeats = selectedSeats.filter(s => s !== seatId);
                el.classList.remove('selected');
            } else {
                selectedSeats.push(seatId);
                el.classList.add('selected');
            }
        }

        function showMovies() {
            document.getElementById('movies').style.display = 'flex';
            document.getElementById('seats-container').style.display = 'none';
            selectedSeats = [];
        }

        loadMovies();
    </script>
</body>
</html>
